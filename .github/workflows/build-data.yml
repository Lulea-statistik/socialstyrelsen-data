name: Bygg Socialstyrelsens data
on:
  push:
    paths:
      - 'scripts/build_dodsorsaker.py'
  workflow_dispatch:
  schedule:
    - cron: '25 7 10 * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hämta och bearbeta officiella CSV-data
        run: python scripts/build_dodsorsaker.py
      - name: Kontrollera genererat material
        run: |
          python -m json.tool docs/data/dodsorsaker.json > /dev/null
          python -m json.tool docs/data/dodsorsaker-alder.json > /dev/null
      - name: Spara uppdaterade data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/dodsorsaker.json docs/data/dodsorsaker-alder.json
          if ! git diff --cached --quiet; then
            git commit -m "Uppdatera bearbetade dödsorsaksdata"
            git push
          fi
