name: Bygg SCB åldersspecifika födelsetal
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_scb_fertility_rates.py
      - run: python -m json.tool docs/data/scb-fertility-rates.json > /dev/null
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/scb-fertility-rates.json
          if ! git diff --cached --quiet; then
            git commit -m "Uppdatera SCB åldersspecifika födelsetal"
            git push
          fi
