name: Inventera graviditetsdata
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_graviditet.py
      - name: Build maternity statistics dataset
        run: python scripts/build_graviditet.py
      - name: Commit schema inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/graviditet-inventering.json docs/data/graviditet.json
          if ! git diff --cached --quiet; then
            git commit -m "Inventera Socialstyrelsens graviditetsdata"
            git push
          fi
