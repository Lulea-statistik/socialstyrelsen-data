name: Granska SCB födelsetal
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_scb_fertility.py
      - run: python -m json.tool docs/data/scb-fertility-metadata.json > /dev/null
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/scb-fertility-metadata.json
          if ! git diff --cached --quiet; then
            git commit -m "Dokumentera SCB API för födelsetal"
            git push
          fi
